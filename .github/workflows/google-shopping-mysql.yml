name: Google Shopping Scraper (MySQL Flow)

on:
  workflow_dispatch:
    inputs:
      input_filename:
        description: "Input CSV filename (optional, ignored)"
        required: false
        default: ""
        type: string

      total_chunks:
        description: "Parallel workers to run in this account"
        required: true
        default: "40"
        type: string
      total_accounts:
        description: "Total number of GitHub accounts used for scraping"
        required: true
        default: "8"
        type: string
      products_per_hour:
        description: "Expected products per worker per hour"
        required: true
        default: "50"
        type: string
      max_runtime_hours:
        description: "Maximum hours per worker"
        required: true
        default: "5.5"
        type: string
      claim_limit:
        description: "Products claimed per worker (blank = products_per_hour * max_runtime_hours)"
        required: false
        default: ""
        type: string
      run_depth:
        description: "Current recursive run depth"
        required: true
        default: "1"
        type: string
      max_depth:
        description: "Maximum recursive run depth"
        required: true
        default: "50"
        type: string
      reset_errors:
        description: "Reset previous errors/invalid URLs to pending before starting"
        required: true
        default: "false"
        type: boolean
      product_ids:
        description: "Comma-separated list of product IDs to scrape directly (optional)"
        required: false
        default: ""
        type: string
      run_resolve_redirects:
        description: "Resolve Google share URLs (main repository only)"
        required: false
        default: "true"
        type: string
      use_free_proxies:
        description: "Fetch and rotate free public proxies to bypass IP captcha blocks"
        required: true
        default: "false"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pymysql cryptography pandas

      - name: Reset errors if requested
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
        run: |
          python gshopping/gscraper_pg.py --reset-errors

      - id: matrix
        run: |
          if [ -n "${{ github.event.inputs.product_ids }}" ]; then
            TOTAL_CHUNKS=1
          else
            TOTAL_CHUNKS=${{ github.event.inputs.total_chunks || 40 }}
          fi

          MATRIX="["
          for ((i=1;i<=TOTAL_CHUNKS;i++)); do
            MATRIX+="{\"worker_index\":$i},"
          done
          MATRIX="${MATRIX%,}]"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX"

  scrape:
    needs: plan
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget gnupg ca-certificates unzip xvfb libxss1 libappindicator3-1 \
            libindicator7 libnss3 libnspr4 libatk-bridge2.0-0 libgtk-3-0 \
            libx11-xcb1 libxcomposite1 libxrandr2 libgbm1 libasound2 \
            fonts-liberation libu2f-udev ffmpeg

      - name: Download fixed Google Chrome 146
        run: |
          CHROME_VERSION=146.0.7680.71
          DOWNLOAD_DIR=/tmp/chrome146
          ZIP_PATH=/tmp/chrome-${CHROME_VERSION}.zip
          mkdir -p "$DOWNLOAD_DIR"
          wget -qO "$ZIP_PATH" "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chrome-linux64.zip"
          unzip -q "$ZIP_PATH" -d "$DOWNLOAD_DIR"
          sudo rm -rf "/opt/google-chrome-${CHROME_VERSION}"
          sudo mv "${DOWNLOAD_DIR}/chrome-linux64" "/opt/google-chrome-${CHROME_VERSION}"
          sudo ln -sf "/opt/google-chrome-${CHROME_VERSION}/chrome" /usr/bin/google-chrome-stable
          sudo chmod +x "/opt/google-chrome-${CHROME_VERSION}/chrome"
          echo "CHROME_BIN=/opt/google-chrome-${CHROME_VERSION}/chrome" >> "$GITHUB_ENV"

      - name: Download matching ChromeDriver 146
        run: |
          CHROMEDRIVER_VERSION=146.0.7680.72
          DRIVER_DIR=/opt/chromedriver-${CHROMEDRIVER_VERSION}
          ZIP_PATH=/tmp/chromedriver-${CHROMEDRIVER_VERSION}.zip
          wget -qO "$ZIP_PATH" "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip -q "$ZIP_PATH" -d /tmp
          sudo rm -rf "$DRIVER_DIR"
          sudo mkdir -p "$DRIVER_DIR"
          sudo mv /tmp/chromedriver-linux64/chromedriver "$DRIVER_DIR/"
          sudo chmod +x "$DRIVER_DIR/chromedriver"
          echo "CHROMEDRIVER_BIN=${DRIVER_DIR}/chromedriver" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install \
            selenium==4.18.1 \
            undetected-chromedriver==3.5.5 \
            webdriver-manager \
            pandas==2.1.4 \
            beautifulsoup4==4.12.2 \
            requests==2.31.0 \
            lxml==4.9.3 \
            fake-useragent==1.4.0 \
            python-dateutil==2.8.2 \
            pymysql==1.1.0 \
            cryptography \
            SQLAlchemy==2.0.25 \
            python-dotenv \
            pydub==0.25.1 \
            SpeechRecognition==3.10.1

      - name: Run scraper worker directly to MySQL
        env:
          DISPLAY: :99
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          PRODUCTS_PER_HOUR: ${{ github.event.inputs.products_per_hour || '50' }}
          MAX_RUNTIME_HOURS: ${{ github.event.inputs.max_runtime_hours || '5.5' }}
          CLAIM_LIMIT: ${{ github.event.inputs.claim_limit }}
          SCRAPER_WORKER_ID: gshopping-mysql-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.worker_index }}
          PRODUCT_IDS: ${{ github.event.inputs.product_ids }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3

          if [ -n "$PRODUCT_IDS" ]; then
            TOTAL_WORKERS=1
          else
            TOTAL_WORKERS="${{ github.event.inputs.total_chunks || 40 }}"
          fi

          if [ "${{ github.event.inputs.use_free_proxies }}" = "true" ]; then
            USE_PROXIES_FLAG="--use-free-proxies"
          else
            USE_PROXIES_FLAG=""
          fi

          python -u gshopping/gscraper_pg.py \
            --chunk-id ${{ matrix.worker_index }} \
            --total-chunks "$TOTAL_WORKERS" \
            --products-per-hour "$PRODUCTS_PER_HOUR" \
            --max-runtime-hours "$MAX_RUNTIME_HOURS" \
            --worker-id "$SCRAPER_WORKER_ID" \
            --product-ids "$PRODUCT_IDS" \
            --total-accounts "${{ github.event.inputs.total_accounts || '8' }}" \
            $USE_PROXIES_FLAG

  dispatch_next_round:
    needs: scrape
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install database and reporting dependencies
        run: |
          pip install pymysql cryptography pandas python-dotenv

      - name: Check if product fetching is finished in DB
        id: check_rem
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
        run: |
          python - <<'PY'
          import os
          import pymysql
          import time
          import random
          
          pending_count = 0
          claimed_count = 0
          
          try:
              mysql_host = os.environ.get("MYSQL_HOST")
              mysql_port = os.environ.get("MYSQL_PORT", "3306")
              try:
                  mysql_port = int(mysql_port)
              except ValueError:
                  mysql_port = 3306
              mysql_user = os.environ.get("MYSQL_USER")
              mysql_pass = os.environ.get("MYSQL_PASS")
              mysql_db = os.environ.get("MYSQL_DB")
              
              conn = None
              max_retries = 8
              for attempt in range(1, max_retries + 1):
                  try:
                      conn = pymysql.connect(
                          host=mysql_host,
                          port=mysql_port,
                          user=mysql_user,
                          password=mysql_pass,
                          database=mysql_db,
                          connect_timeout=30
                      )
                      print(f"Successfully connected to MySQL on attempt {attempt}")
                      break
                  except Exception as err:
                      print(f"Connection attempt {attempt} failed: {err}")
                      if attempt == max_retries:
                          raise
                      sleep_time = (2 ** attempt) + random.uniform(0.5, 1.5)
                      time.sleep(sleep_time)
              
              cursor = conn.cursor()
              query = """
                  SELECT
                      COALESCE(SUM(CASE WHEN scraping_status = 'pending' THEN 1 ELSE 0 END), 0) AS pending_count,
                      COALESCE(SUM(CASE WHEN scraping_status = 'claimed' THEN 1 ELSE 0 END), 0) AS claimed_count
                  FROM osb_products
                  WHERE status = 1
              """
              cursor.execute(query)
              pending_count, claimed_count = cursor.fetchone()
              cursor.close()
              conn.close()
              
              print(f"Pending products globally: {pending_count}")
              print(f"Claimed/in-progress products globally: {claimed_count}")
              
          except Exception as e:
              print(f"Error checking DB: {e}")
              print("⚠️ Database connection failed. Assuming pending products exist to prevent pipeline halts.")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("pending_count=1\n")
                  f.write("claimed_count=0\n")
          PY

      - name: Trigger next round workflow
        if: ${{ github.event.inputs.product_ids == '' && fromJSON(steps.check_rem.outputs.pending_count || '0') > 0 && fromJSON(github.event.inputs.run_depth || '1') < fromJSON(github.event.inputs.max_depth || '50') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runDepth = Number('${{ github.event.inputs.run_depth || '1' }}');
            const nextDepth = runDepth + 1;
            const totalChunks = '${{ github.event.inputs.total_chunks || '40' }}';
            const totalAccounts = '${{ github.event.inputs.total_accounts || '8' }}';
            const maxDepth = '${{ github.event.inputs.max_depth || '50' }}';
            const productsPerHour = '${{ github.event.inputs.products_per_hour || '50' }}';
            const maxRuntimeHours = '${{ github.event.inputs.max_runtime_hours || '5.5' }}';
            const claimLimit = '${{ github.event.inputs.claim_limit }}';
            const runResolveRedirects = '${{ github.event.inputs.run_resolve_redirects || 'true' }}';
            const useFreeProxies = '${{ github.event.inputs.use_free_proxies || 'false' }}';

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'gshopping_mysql.yml',
              ref: context.ref,
              inputs: {
                total_chunks: totalChunks,
                total_accounts: totalAccounts,
                products_per_hour: productsPerHour,
                max_runtime_hours: maxRuntimeHours,
                claim_limit: claimLimit,
                run_depth: String(nextDepth),
                max_depth: maxDepth,
                reset_errors: 'false',
                run_resolve_redirects: runResolveRedirects,
                use_free_proxies: useFreeProxies
              },
            });

            core.info(`Triggered next round depth=${nextDepth}`);

      - name: Generate and upload reports if no products remaining
        if: ${{ github.event.inputs.product_ids == '' && fromJSON(steps.check_rem.outputs.pending_count || '0') == 0 && fromJSON(steps.check_rem.outputs.claimed_count || '0') == 0 }}
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ORACLE_SFTP_UPLOAD: ${{ secrets.ORACLE_SFTP_UPLOAD }}
          ORACLE_SFTP_HOST: ${{ secrets.ORACLE_SFTP_HOST }}
          ORACLE_SFTP_USER: ${{ secrets.ORACLE_SFTP_USER }}
          ORACLE_SFTP_PRIVATE_KEY: ${{ secrets.ORACLE_SFTP_PRIVATE_KEY }}
          ORACLE_SFTP_KEY_PATH: ${{ secrets.ORACLE_SFTP_KEY_PATH }}
          ORACLE_SFTP_REMOTE_DIR: ${{ secrets.ORACLE_SFTP_REMOTE_DIR }}
        run: |
          python gshopping/export_reports.py

